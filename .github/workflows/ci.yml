name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chainwatch
          POSTGRES_PASSWORD: chainwatch
          POSTGRES_DB: chainwatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chainwatch -d chainwatch"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CARGO_TERM_COLOR: always
      DATABASE_URL: postgres://chainwatch:chainwatch@localhost:5432/chainwatch
      RPC_URL: http://127.0.0.1:8545
      RUST_LOG: warn
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1

      - name: Start Anvil
        run: anvil --chain-id 31337 --port 8545 --silent &

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Unit tests
        run: cargo test --all-features --locked

      - name: Integration tests
        run: cargo test --all-features --locked -- --ignored

      - name: Foundry tests
        run: forge test --root contracts
